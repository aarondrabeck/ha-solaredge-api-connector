[project]
name = "ha-solaredge-api-connector"
version = "0.1.3"
description = "Home Assistant integration for the SolarEdge ONE Developer Platform (Monitoring API v2)"
requires-python = ">=3.14"
license = "MIT"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "D"]
ignore = ["D203", "D213", "PLR0913", "PLR2004", "PLR0912", "PLR0915", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR2004", "PLC0415", "PLR0917"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
